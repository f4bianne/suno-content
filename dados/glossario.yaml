# Glossário de termos financeiros com nível mínimo (roadmap, Fase 0, item 2).
# Regra de nível e fundamentação em planejamento/niveis.md.
#
# Campos de cada termo:
#   termo             forma canônica
#   nivel             nível mínimo em que o termo aparece sem explicação (1, 2 ou 3)
#   categoria         assunto, para revisão
#   fonte             chave de `fontes`
#   variantes         outras formas para casar no texto (a forma canônica já conta)
#   ambiguo           true quando a palavra também tem uso comum fora de finanças;
#                     o casamento deve exigir contexto
#   explicacao_curta  paráfrase própria (não copia o texto das fontes)
#   docs_corpus       em quantos dos 155 documentos do corpus o termo (ou variante) aparece;
#                     calculado por script, não editar à mão
#
# Convenções de casamento:
#   - variante toda em maiúsculas (CDI, IPCA) casa só em maiúsculas e como palavra inteira;
#   - as demais casam sem diferença de caixa, por lematização;
#   - no mesmo nível, vale a forma mais longa (juros compostos antes de juros).
#
# Variante só entra quando é o nome técnico do termo. Descrições em linguagem simples ("taxa básica de
# juros" para Selic, "cenário de referência") não são variantes: para o leitor iniciante elas são a explicação.
#
# Fora da lista, por não serem conceitos financeiros: Aprender Valor, Calculadora do Cidadão,
# Registrato, Serasa, SPC Brasil, Senha, Bloqueio, Desbloqueio, Crédito/Débito (no extrato).
# O glossário da B3 só foi lido de A até "Agressão" (página 1 de 3).

fontes:
  bcb:
    nome: "Glossário Simplificado de Termos Financeiros (Banco Central, Cidadania Financeira)"
    url: "https://www.bcb.gov.br/content/cidadaniafinanceira/documentos_cidadania/Informacoes_gerais/glossario_cidadania_financeira.pdf"
  cvm:
    nome: "Dicionário CVM"
    url: "https://www.gov.br/cvm/pt-br/centrais-de-conteudo/dicionario-cvm"
    licenca: "CC BY-ND 3.0 (citar sem adaptar o texto)"
  b3:
    nome: "Glossário Bora Investir (B3)"
    url: "https://borainvestir.b3.com.br/glossario/"
    licenca: "Todos os direitos reservados (só nome do termo e link)"
  corpus:
    nome: "Jargão recorrente nas atas do Copom, relatórios do BC e normas da CVM do corpus, sem verbete em glossário para leigos"
    url: null
    nota: "Nível 3 por ausência nos glossários abertos; confirmar na calibração"
  mercado:
    nome: "Jargão de balanço e de mercado usado em releases de empresas e bancos, sem verbete nos glossários abertos consultados"
    url: null
    nota: "O corpus tem poucos releases; nível provisório"

