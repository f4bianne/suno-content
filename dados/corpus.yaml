# Corpus fixo de referência (roadmap, item 3): documentos oficiais e públicos.
# O repositório guarda só esta lista; os arquivos baixados ficam em dados/corpus/ (fora do git).
# Para baixar: python scripts/baixa_corpus.py
# Depois, para extrair o texto: python scripts/extrai_texto.py

atas_copom:
  # Atas do Copom (BC). A lista de reuniões vem da API; o PDF segue o padrão abaixo.
  api: "https://www.bcb.gov.br/api/servico/sitebcb/copom/atas?quantidade=500&filtro="
  url: "https://www.bcb.gov.br/content/copom/atascopom/Copom{nro}-not{data}{nro}.pdf"
  reuniao_minima: 200   # as anteriores usam outro padrão de endereço
  pasta: atas_copom

padroes:
  # Documentos periódicos; combinações inexistentes (404) são ignoradas.
  - nome: relatorio_inflacao
    descricao: "Relatório de Inflação (até 2024) e de Política Monetária (a partir de 2025), BC"
    pasta: relatorios_bc
    anos: [2016, 2026]
    meses: ["03", "06", "09", "12"]
    urls:
      ate_2024: "https://www.bcb.gov.br/content/ri/relatorioinflacao/{ano}{mes}/ri{ano}{mes}P.pdf"
      desde_2025: "https://www.bcb.gov.br/content/ri/relatorioinflacao/{ano}{mes}/rpm{ano}{mes}p.pdf"
    arquivo: "rpm_{ano}{mes}.pdf"
  - nome: estabilidade_financeira
    descricao: "Relatório de Estabilidade Financeira, BC (semestral)"
    pasta: estabilidade_financeira
    anos: [2016, 2026]
    meses: ["04", "05", "10", "11"]
    urls:
      todos: "https://www.bcb.gov.br/content/publicacoes/ref/{ano}{mes}/RELESTAB{ano}{mes}-refPub.pdf"
    arquivo: "ref_{ano}{mes}.pdf"

